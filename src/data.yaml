  - title: 'In search of explosive primes: the inverse volcano problem'
    date: 2026-09-01
    event: ntdu-14
    kind: contributed
    length: 20
    award: JNT Student Talk Prize, Honourable Mention
    abstract: |
      The connected components of the graph of $ell$-isogenies between ordinary elliptic curves over a finite field have a remarkable structure called $ell$-volcanoes.
      The inverse volcano problem asks whether a given volcano can occur as a connected component over $FF_(p^k)$, and for which primes $p$.
      We call such primes $k$-explosive.
      Every volcano has infinitely many $1$-explosive primes, but existence can fail for larger $k$. \
      Our recent work, joint with Alex Ghitza and Dhruv Gupta, resolves the problem in most cases.
      After briefly surveying our results, I will work through one case from start to finish.
      Along the way, we will see how a question about isogeny graphs becomes one about class groups of imaginary quadratic orders, and why the depth of the volcano must be compared with the $ell$-adic valuation of $k$.

  - title: 'Section 2 in the paper #link("https://www.sciencedirect.com/science/article/pii/S0001870817301640")[Super-Golden-Gates for $op("PU")(2)$] by Parzanchevski and Sarnak'
    date: 2026-08-03
    event: nuts-2026
    length: 50

  - title: On the inverse volcano problem over non-prime finite fields
    date: 2025-12-11
    event: austms-2025
    session: number-theory
    kind: contributed
    length: 20
    abstract: |
      The graph of $ell$-isogenies between elliptic curves over finite fields has connected components called volcanoes.
      The inverse volcano problem asks whether, given such a volcano, one can find a finite field $FF_(p^k)$ and a prime $ell$ such that the graph of $ell$-isogenies contains the volcano.
      Over $FF_p$ it is known that the answer is affirmative.
      I will discuss some results in the non-prime field case.

  - title: Isogeny graphs of elliptic curves
    date: 2025-03-17
    event: nuts-2025
    length: 50
